name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: 1.0.0
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test bridge
        run: npm test
      - name: Build portable package
        shell: pwsh
        run: .\scripts\build-release.ps1 -Version '${{ inputs.version }}'
      - name: Upload release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = ".release\EmotionBallDesktop-v${{ inputs.version }}-win-x64.zip"
          $setup = ".release\EmotionBallDesktop-v${{ inputs.version }}-setup.exe"
          gh release upload '${{ inputs.tag }}' $setup "$setup.sha256" $archive "$archive.sha256" --clobber
