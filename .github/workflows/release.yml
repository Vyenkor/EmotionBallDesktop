name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: 1.0.0
      tag:
        description: Existing GitHub Release tag
        required: true
        default: v1.0.0
  push:
    tags:
      - 'v*'

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test bridge
        run: npm test
      - name: Build portable package
        shell: pwsh
        run: |
          $version = '${{ env.RELEASE_VERSION }}'.TrimStart('v')
          .\scripts\build-release.ps1 -Version $version
      - name: Upload release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ env.RELEASE_VERSION }}'.TrimStart('v')
          $tag = '${{ env.RELEASE_TAG }}'
          $archive = ".release\Emotionball-Deskpet-v$version-win-x64.zip"
          $setup = ".release\Emotionball-Deskpet-v$version-setup.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Emotionball-Deskpet $version" --generate-notes
          }
          gh release upload $tag $setup "$setup.sha256" $archive "$archive.sha256" --clobber
